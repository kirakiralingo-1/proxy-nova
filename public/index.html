<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UV Browser Proxy</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/uv/sw.js");
      });
    }
  </script>
</head>
<body>
  <div class="browser-bar">
    <button class="nav-btn" onclick="history.back()">←</button>
    <button class="nav-btn" onclick="history.forward()">→</button>
    <button class="nav-btn" onclick="goHome()">⌂</button>
    <input type="text" id="urlInput" placeholder="URLを入力 (例: youtube.com)" autofocus>
    <button id="searchButton" class="go-btn">Go</button>
  </div>

  <script>
    const urlInput = document.getElementById("urlInput");

    urlInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("searchButton").click();
      }
    });

    function navigate(url) {
      if (!url.includes(".")) {
        url = "https://www.google.com/search?q=" + encodeURIComponent(url);
      } else {
        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "https://" + url;
        }
      }
      // ★ iframe なし：トップレベルで直接遷移
      location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
    }

    document.getElementById("searchButton").onclick = function(e) {
      e.preventDefault();
      navigate(urlInput.value.trim());
    };

    function goHome() {
      navigate("https://www.google.com");
    }
  </script>
</body>
</html>
