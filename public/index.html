<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #fff; }
    .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
    .toolbar button { padding: 6px 10px; border: none; border-radius: 4px; background: transparent; cursor: pointer; font-size: 16px; color: #555; transition: background 0.15s; }
    .toolbar button:hover { background: #e8e8e8; }
    .toolbar button:active { background: #d0d0d0; }
    #url-bar { flex: 1; min-width: 200px; padding: 8px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; background: #fff; }
    #url-bar:focus { border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,0.2); }
    .go-btn { background: #4285f4 !important; color: #fff !important; font-weight: 500; padding: 8px 18px !important; }
    .go-btn:hover { background: #3367d6 !important; }
    .frame-container { flex: 1; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; gap: 12px; }
    .loading.show { display: flex; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top: 3px solid #4285f4; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-text { font-size: 13px; color: #888; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-bar { padding: 4px 12px; font-size: 11px; color: #999; background: #fafafa; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="goBack()" title="戻る">←</button>
    <button onclick="goForward()" title="進む">→</button>
    <button onclick="reloadPage()" title="再読み込み">⟳</button>
    <input id="url-bar" type="text" placeholder="URL を入力（例: discord.com, youtube.com）" onkeydown="if(event.key==='Enter')navigate()">
    <button class="go-btn" onclick="navigate()">Go</button>
  </div>
  <div class="frame-container">
    <iframe id="frame" src="about:blank"></iframe>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">読み込み中...</div>
    </div>
  </div>
  <div class="status-bar" id="status-bar">Ready</div>

  <script>
    const frame = document.getElementById('frame');
    const urlBar = document.getElementById('url-bar');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const statusBar = document.getElementById('status-bar');

    function getProxyUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      return '/proxy/' + url;
    }

    function navigate() {
      let url = urlBar.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
        urlBar.value = url;
      }
      loading.classList.add('show');
      loadingText.textContent = '読み込み中...';
      statusBar.textContent = url;
      frame.src = getProxyUrl(url);
    }

    function reloadPage() {
      if (frame.src && frame.src !== 'about:blank') {
        loading.classList.add('show');
        // キャッシュバイパス
        const src = frame.src + (frame.src.includes('?') ? '&' : '?') + '_t=' + Date.now();
        frame.src = src;
      }
    }

    function goBack() {
      // iframe の履歴は直接操作できないので、親の履歴を使用
      history.back();
    }

    function goForward() {
      history.forward();
    }

    let loadTimer;
    frame.addEventListener('load', () => {
      clearTimeout(loadTimer);
      loading.classList.remove('show');
    });

    // ロードタイムアウト
    frame.addEventListener('load', () => {
      loadTimer = setTimeout(() => {
        loading.classList.remove('show');
      }, 30000);
    });

    // 初期表示
    urlBar.value = 'youtube.com';
    navigate();
  </script>
</body>
</html>
