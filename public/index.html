<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proxy Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1e1e2e; color: #cdd6f4; }

    .toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: #181825;
      border-bottom: 1px solid #313244; flex-shrink: 0;
    }
    .btn {
      background: #313244; border: none; color: #cdd6f4;
      width: 34px; height: 34px; border-radius: 8px;
      cursor: pointer; font-size: 16px; display: flex;
      align-items: center; justify-content: center;
      transition: background .15s;
    }
    .btn:hover { background: #45475a; }
    .btn:disabled { opacity: .4; cursor: default; }

    .address-bar {
      flex: 1; height: 34px; background: #313244;
      border: 1px solid #45475a; border-radius: 8px;
      padding: 0 14px; color: #cdd6f4; font-size: 14px;
      outline: none; transition: border-color .15s;
    }
    .address-bar:focus { border-color: #89b4fa; }

    .go-btn {
      background: #89b4fa; color: #1e1e2e; border: none;
      padding: 0 16px; height: 34px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .go-btn:hover { background: #74c7ec; }

    .iframe-wrap { flex: 1; }
    .iframe-wrap iframe {
      width: 100%; height: 100%; border: none;
      background: #fff;
    }

    .status {
      padding: 4px 12px; font-size: 11px; color: #6c7086;
      background: #181825; border-top: 1px solid #313244;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="btn" id="back" disabled>←</button>
    <button class="btn" id="fwd" disabled>→</button>
    <button class="btn" id="reload">⟳</button>
    <button class="btn" id="home">⌂</button>
    <input
      class="address-bar" id="url"
      type="text" placeholder="https://www.youtube.com"
      spellcheck="false"
    />
    <button class="go-btn" id="go">Go</button>
  </div>

  <div class="iframe-wrap">
    <iframe id="frame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <div class="status" id="status">Ready</div>

  <script>
    const frame = document.getElementById("frame");
    const urlInput = document.getElementById("url");
    const status = document.getElementById("status");
    const backBtn = document.getElementById("back");
    const fwdBtn = document.getElementById("fwd");

    let history = [];
    let histIndex = -1;

    function navigate(url) {
      if (!url) return;
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }
      const proxyUrl = "/p/" + url;
      frame.src = proxyUrl;
      status.textContent = "Loading: " + url;

      // 履歴管理
      if (histIndex < history.length - 1) history = history.slice(0, histIndex + 1);
      history.push(url);
      histIndex++;
      updateButtons();
      urlInput.value = url;
    }

    function updateButtons() {
      backBtn.disabled = histIndex <= 0;
      fwdBtn.disabled = histIndex >= history.length - 1;
    }

    document.getElementById("go").onclick = () => navigate(urlInput.value);
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") navigate(urlInput.value);
    });

    backBtn.onclick = () => {
      if (histIndex > 0) {
        histIndex--;
        frame.src = "/p/" + history[histIndex];
        urlInput.value = history[histIndex];
        updateButtons();
      }
    };

    fwdBtn.onclick = () => {
      if (histIndex < history.length - 1) {
        histIndex++;
        frame.src = "/p/" + history[histIndex];
        urlInput.value = history[histIndex];
        updateButtons();
      }
    };

    document.getElementById("reload").onclick = () => {
      if (histIndex >= 0) frame.src = "/p/" + history[histIndex];
    };

    document.getElementById("home").onclick = () => {
      frame.src = "about:blank";
      urlInput.value = "";
      status.textContent = "Ready";
    };

    frame.addEventListener("load", () => {
      status.textContent = "Loaded: " + (history[histIndex] || "about:blank");
    });

    // 初期表示
    navigate("https://www.bing.com");
  </script>
</body>
</html>
