<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Proxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;background:#111;color:#eee}
.bar{display:flex;gap:6px;padding:10px;background:#1a1a2e;border-bottom:1px solid #333;align-items:center}
.bar input{flex:1;height:36px;background:#222;border:1px solid #444;border-radius:6px;padding:0 12px;color:#fff;font-size:14px;outline:none}
.bar input:focus{border-color:#6c5ce7}
.bar button{height:36px;padding:0 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.go{background:#6c5ce7;color:#fff}
.go:hover{background:#5a4bd1}
.nav{background:#333;color:#ccc}
.nav:hover{background:#444}
.info{padding:8px 12px;font-size:11px;color:#666;background:#1a1a2e}
</style>
</head>
<body>
<div class="bar">
  <button class="nav" onclick="goBack()">←</button>
  <button class="nav" onclick="goFwd()">→</button>
  <button class="nav" onclick="goHome()">⌂</button>
  <input id="url" type="text" placeholder="https://www.youtube.com" spellcheck="false"/>
  <button class="go" onclick="navigate()">Go</button>
</div>
<div class="info">全リクエストがサーバ経由でプロキシされます。iframe不使用・トップレベルレンダリング。</div>

<script>
const input = document.getElementById("url");
let hist = [], hi = -1;

function navigate(url) {
  if (!url) return;
  if (!url.startsWith("http")) url = "https://" + url;
  if (hi < hist.length - 1) hist = hist.slice(0, hi + 1);
  hist.push(url);
  hi++;
  input.value = url;
  window.location.href = "/p/" + url;
}

function goBack() { if (hi > 0) { hi--; window.location.href = "/p/" + hist[hi]; } }
function goFwd() { if (hi < hist.length - 1) { hi++; window.location.href = "/p/" + hist[hi]; } }
function goHome() { window.location.href = "/"; }

input.addEventListener("keydown", e => { if (e.key === "Enter") navigate(input.value); });
</script>
</body>
</html>
