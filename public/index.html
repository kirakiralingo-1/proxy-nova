<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scramjet Proxy</title>
<style>
:root{--bg:#0a0a0f;--card:#14141f;--accent:#00e5ff;--accent2:#7c4dff;--text:#e8e8ec;--dim:#6b6b80}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:1.2rem 2rem;display:flex;align-items:center;gap:.8rem;border-bottom:1px solid #1e1e2e}
header .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;font-size:1.1rem;color:#000}
header h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em}
header span{font-size:.75rem;color:var(--dim);margin-left:auto}
.search{display:flex;gap:.6rem;padding:1.5rem 2rem;max-width:720px;width:100%;margin:0 auto}
.search input{flex:1;padding:.75rem 1.1rem;border:1px solid #2a2a3e;border-radius:12px;background:var(--card);color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search button{padding:.75rem 1.4rem;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;font-size:.95rem;cursor:pointer;transition:opacity .2s}
.search button:hover{opacity:.85}
#frameContainer{flex:1;padding:0 2rem 2rem;max-width:1280px;width:100%;margin:0 auto}
#frameContainer iframe{width:100%;height:100%;min-height:60vh;border:none;border-radius:14px;background:#fff;box-shadow:0 0 0 1px #1e1e2e,0 8px 32px rgba(0,0,0,.4)}
.hint{text-align:center;color:var(--dim);font-size:.8rem;padding:1rem}
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <h1>Scramjet Proxy</h1>
  <span>interception-based · no server-side fetch</span>
</header>

<div class="search">
  <input id="url" type="text" placeholder="https://example.com" />
  <button id="goBtn">Go</button>
</div>

<div id="frameContainer"></div>
<p class="hint">Service Worker 経由でトラフィックを書き換え、CORS / X-Frame-Options を回避します。</p>

<script>
(async () => {
  // 1. Service Worker を登録
  if ('serviceWorker' in navigator) {
    await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    await navigator.serviceWorker.ready;
  }

  // 2. Scramjet Controller を初期化
  const { ScramjetController } = $scramjetLoadController();
  const scramjet = new ScramjetController({
    prefix: '/scramjet/',
    files: {
      wasm: '/scram/scramjet.wasm.wasm',
      all:  '/scram/scramjet.all.js',
      sync: '/scram/scramjet.sync.js',
    },
  });
  await scramjet.init();

  // 3. フレームを作成
  const frame = scramjet.createFrame();
  document.getElementById('frameContainer').appendChild(frame.frame);

  // 4. 入力処理
  const input = document.getElementById('url');
  const go = () => {
    let u = input.value.trim();
    if (!u) return;
    if (!u.startsWith('http')) u = 'https://' + u;
    frame.go(u);
  };
  document.getElementById('goBtn').addEventListener('click', go);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

  // URL 変更を反映
  frame.addEventListener('urlchange', e => { input.value = e.url; });
})();
</script>
</body>
</html>
