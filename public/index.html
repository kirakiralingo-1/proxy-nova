<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; }
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: #16213e;
    border-bottom: 1px solid #0f3460;
    position: sticky; top: 0; z-index: 100;
  }
  .toolbar button {
    background: #0f3460; color: #fff; border: none;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 14px;
  }
  .toolbar button:hover { background: #e94560; }
  #url-input {
    flex: 1; padding: 10px 14px; border-radius: 20px;
    border: 1px solid #0f3460; background: #1a1a2e;
    color: #eee; font-size: 14px; outline: none;
  }
  #url-input:focus { border-color: #e94560; }
  #frame-container { width: 100%; height: calc(100vh - 52px); }
  #frame-container iframe { width: 100%; height: 100%; border: none; background: #fff; }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="goBack()">←</button>
  <button onclick="goHome()">⌂</button>
  <input id="url-input" type="text" placeholder="URLを入力 (例: https://example.com)"
         onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">→</button>
</div>
<div id="frame-container">
  <iframe id="frame" src="about:blank"></iframe>
</div>
<script>
const input = document.getElementById('url-input');
const frame = document.getElementById('frame');
let history = [];
let histIdx = -1;

function normalize(url) {
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function go() {
  const url = normalize(input.value.trim());
  if (!url) return;
  frame.src = '/proxy?url=' + encodeURIComponent(url);
  history = history.slice(0, histIdx + 1);
  history.push(url);
  histIdx++;
}

function goBack() {
  if (histIdx > 0) { histIdx--; frame.src = '/proxy?url=' + encodeURIComponent(history[histIdx]); }
}

function goHome() {
  frame.src = '/proxy?url=' + encodeURIComponent('https://www.google.com');
}
</script>
</body>
</html>
