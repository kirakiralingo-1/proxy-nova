<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; display: flex; flex-direction: column; height: 100vh; }
  .toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: #1a1a2e;
    border-bottom: 1px solid #2a2a4a;
    position: sticky; top: 0; z-index: 9999;
  }
  .toolbar button {
    background: #2a2a4a; color: #ccc; border: none;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .toolbar button:hover { background: #e94560; color: #fff; }
  #url-input {
    flex: 1; padding: 9px 16px; border-radius: 20px;
    border: 1px solid #2a2a4a; background: #0f0f1a;
    color: #eee; font-size: 14px; outline: none;
  }
  #url-input:focus { border-color: #e94560; }
  .frame-wrap { flex: 1; position: relative; }
  .frame-wrap iframe { width: 100%; height: 100%; border: none; background: #fff; }
  #status {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.7); color: #fff; padding: 4px 12px;
    border-radius: 12px; font-size: 12px; display: none;
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="btn-back" title="戻る">←</button>
  <button id="btn-fwd" title="進む">→</button>
  <button id="btn-reload" title="再読み込み">⟳</button>
  <input id="url-input" type="text" placeholder="https://youtube.com" autocomplete="off">
  <button id="btn-go" title="開く">Go</button>
</div>
<div class="frame-wrap">
  <div id="status">読み込み中...</div>
  <iframe id="frame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
</div>
<script>
const input = document.getElementById('url-input');
const frame = document.getElementById('frame');
const status = document.getElementById('status');
let hist = [], idx = -1;

function normalize(u) {
  u = u.trim();
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function navigate(url) {
  if (!url) return;
  status.style.display = 'block';
  frame.src = '/proxy?url=' + encodeURIComponent(url);
  hist = hist.slice(0, idx + 1);
  hist.push(url);
  idx++;
  input.value = url;
}

frame.addEventListener('load', () => { status.style.display = 'none'; });

document.getElementById('btn-go').onclick = () => navigate(normalize(input.value));
input.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(normalize(input.value)); });
document.getElementById('btn-back').onclick = () => { if (idx > 0) { idx--; frame.src = '/proxy?url=' + encodeURIComponent(hist[idx]); } };
document.getElementById('btn-fwd').onclick = () => { if (idx < hist.length - 1) { idx++; frame.src = '/proxy?url=' + encodeURIComponent(hist[idx]); } };
document.getElementById('btn-reload').onclick = () => { frame.src = frame.src; };

// 初期ページ
navigate('https://www.google.com');
</script>
</body>
</html>
