<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Proxy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <button id="backBtn" title="戻る">←</button>
    <button id="forwardBtn" title="進む">→</button>
    <button id="reloadBtn" title="再読み込み">↻</button>
    <input type="text" id="urlInput" placeholder="URLを入力 (例: youtube.com)" autofocus>
    <button id="goBtn">Go</button>
  </div>
  <div id="status"></div>
  <iframe id="frame" src="about:blank"></iframe>
  <script src="app.js"></script>
</body>
</html>
