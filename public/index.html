<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f1f3f4; border-bottom: 1px solid #ddd; }
    .toolbar button { padding: 6px 12px; border: none; border-radius: 4px; background: #e0e0e0; cursor: pointer; font-size: 14px; }
    .toolbar button:hover { background: #d0d0d0; }
    #url-bar { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; }
    #url-bar:focus { border-color: #4285f4; }
    .frame-container { flex: 1; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; }
    .loading.show { display: flex; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #4285f4; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reload()">⟳</button>
    <input id="url-bar" type="text" placeholder="URLを入力（例: youtube.com）" onkeydown="if(event.key==='Enter')navigate()">
    <button onclick="navigate()">Go</button>
  </div>
  <div class="frame-container">
    <iframe id="frame" src="about:blank"></iframe>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div></div>

  <script>
    const frame = document.getElementById('frame');
    const urlBar = document.getElementById('url-bar');
    const loading = document.getElementById('loading');

    function getProxyUrl(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      return '/proxy/' + url;
    }

    function navigate() {
      const url = urlBar.value.trim();
      if (!url) return;
      loading.classList.add('show');
      frame.src = getProxyUrl(url);
    }

    function reload() {
      if (frame.src && frame.src !== 'about:blank') {
        loading.classList.add('show');
        frame.src = frame.src; // 再読み込み
      }
    }

    function goBack() { history.back(); }
    function goForward() { history.forward(); }

    frame.addEventListener('load', () => {
      loading.classList.remove('show');
    });

    // 初期表示
    urlBar.value = 'youtube.com';
    navigate();
  </script>
</body>
</html>
